[project]
name = "trim-api"
version = "0.1.0"
description = "TRIM backend: FastAPI, SQLAlchemy and Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests build SQL from the fixed RLS_TABLES list and use fake password hashes.
"tests/**" = ["S101", "S105", "S106", "S608"]
# Autogenerated migration bodies keep long constraint strings on one line.
"migrations/versions/**" = ["E501", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
