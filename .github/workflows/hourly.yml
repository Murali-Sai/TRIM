# The hourly job (check-ins, streak evaluation, reminders, usage alerts), called through the
# site's proxy like any /api request. Free on a public repository. GitHub may start a
# scheduled run some minutes late, which the job tolerates: it works on whole hours.
#
# GitHub pauses schedules in a public repository after 60 days without a commit; re-enable
# this workflow from the Actions tab if that happens. Until APP_URL is set, it skips.
name: Hourly

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  run:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Call the hourly job
        env:
          APP_URL: ${{ vars.APP_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        # The API may be asleep: allow time for it to wake, and retry once it is up.
        run: >-
          curl -fsS --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors
          -X POST -H "X-Job-Token: $JOB_TOKEN" "$APP_URL/api/internal/jobs/hourly"
