name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  # Visual regression in the same pinned image the baselines were made in (keep the tag in
  # step with @playwright/test in web/package.json).
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run e2e:visual
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: web/test-results
          retention-days: 14

  # No credential in the repository or in the built site (task 5.5).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 api/tools/secret_grep.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: python3 api/tools/secret_grep.py web/dist --bundle

  # The image Render runs builds, migrates a fresh database and answers /api/health.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trim
          POSTGRES_PASSWORD: trim
          POSTGRES_DB: trim
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t trim-api api
      - run: psql -h 127.0.0.1 -p 5433 -U trim -d trim -f db/init/01-roles.sql
        env:
          PGPASSWORD: trim
      - run: |
          docker run --rm --network host \
            -e TRIM_MIGRATION_DATABASE_URL=postgresql+psycopg://trim:trim@127.0.0.1:5433/trim \
            trim-api alembic upgrade head
      - run: |
          docker run -d --name api --network host -e PORT=8091 trim-api
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8091/api/health

  # Known vulnerabilities in what ships (task 5.4): fails on high or critical npm advisories in
  # the web app's runtime dependencies and on any advisory in the API's locked dependencies.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - uses: astral-sh/setup-uv@v7
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
        working-directory: api
      - run: uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trim
          POSTGRES_PASSWORD: trim
          POSTGRES_DB: trim
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIM_TEST_OWNER_URL: postgresql+psycopg://trim:trim@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      # For the backup and restore drill tests (tests/test_backup_drill.py).
      - run: sudo apt-get update -q && sudo apt-get install -yq age
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
