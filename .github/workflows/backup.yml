# Nightly encrypted backup and restore drill (task 5.6).
#
# 1. backup: dump Neon with ops/backup.sh, encrypted with age to BACKUP_AGE_RECIPIENTS (your
#    offline key and the drill key), and keep it as a workflow artifact for 30 days (free).
#    The repository is public, so anyone signed in to GitHub can download the file; without
#    one of the two age keys it cannot be read.
# 2. drill: download that same file, decrypt it with the drill key, restore it into a
#    throwaway Postgres and check it against its manifest (ops/restore-drill.sh).
# A failure emails the repository's admins (GitHub does this for scheduled runs). Setup:
# docs/DEPLOY.md, "Backups". Until BACKUP_AGE_RECIPIENTS is set, both jobs skip.
name: Backup

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_AGE_RECIPIENTS != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install age and the PostgreSQL 17 client (it can dump 16 and 17 servers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq age postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17
      - name: Back up
        env:
          AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          PSQL: /usr/lib/postgresql/17/bin/psql
          URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          # The tools take a plain postgresql:// URL, without SQLAlchemy's driver suffix.
          SOURCE_URL="${URL/postgresql+psycopg:/postgresql:}" ops/backup.sh "$RUNNER_TEMP/out" \
            > "$RUNNER_TEMP/path"
          mv "$(cat "$RUNNER_TEMP/path")" "$RUNNER_TEMP/backup.tar.age"
      - uses: actions/upload-artifact@v7
        with:
          name: trim-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup.tar.age
          retention-days: 30
          if-no-files-found: error

  drill:
    needs: backup
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trim
          POSTGRES_PASSWORD: trim
          POSTGRES_DB: drill
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install age and the PostgreSQL 17 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq age postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17
      - uses: actions/download-artifact@v4
        with:
          name: trim-backup-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Restore into a scratch database and compare
        env:
          DRILL_KEY: ${{ secrets.BACKUP_DRILL_IDENTITY }}
          TARGET_URL: postgresql://trim:trim@127.0.0.1:5433/drill
          PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
          PSQL: /usr/lib/postgresql/17/bin/psql
        run: |
          umask 077
          printf '%s\n' "$DRILL_KEY" > "$RUNNER_TEMP/drill.key"
          AGE_IDENTITY="$RUNNER_TEMP/drill.key" ops/restore-drill.sh "$RUNNER_TEMP/backup.tar.age"
          rm -f "$RUNNER_TEMP/drill.key"
