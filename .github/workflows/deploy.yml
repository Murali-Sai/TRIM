# Deploy (task 5.5): after CI passes on main, migrate Neon, deploy the API on Render, then
# ship the site and its proxy to Cloudflare Pages, then check the live site. Everything here
# runs on free plans with no card on file.
#
# One-time setup is in docs/DEPLOY.md: the repository variables and secrets below. No key or
# token lives in this repository. Until APP_URL is set, the workflow skips.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; a newer one waits rather than cancelling a half-done one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api:
    # Only a green CI run for a push to main (or a manual run) deploys, and only once the
    # accounts are set up (docs/DEPLOY.md); until then the workflow skips.
    if: >-
      vars.APP_URL != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: astral-sh/setup-uv@v7
      - name: Migrate the database
        working-directory: api
        env:
          TRIM_MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync alembic upgrade head
      - name: Deploy this commit on Render and wait for it to answer
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          API_URL: ${{ vars.RENDER_API_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$HOOK&ref=$SHA" > /dev/null
          # The build takes a few minutes on the free plan; health names the running commit.
          for _ in $(seq 1 60); do
            commit="$(curl -fsS --max-time 90 -H "X-Trim-Proxy-Secret: $PROXY_SECRET" \
              "$API_URL/api/health" | jq -r '.commit // ""' || true)"
            if [ "$commit" = "$SHA" ]; then echo "Render runs $SHA"; exit 0; fi
            sleep 20
          done
          echo "Render did not start $SHA within 20 minutes; see its dashboard" >&2
          exit 1

  web:
    # After the API, so the new site never calls an API that is not there yet.
    needs: api
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Public by design: Turnstile site keys are meant to be in the page.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Secret grep on the built site
        run: python3 ../api/tools/secret_grep.py dist --bundle
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'trim' }} --branch=main --commit-hash=${{ env.SHA }}

  smoke:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: The live site answers, through the proxy, with its security headers
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 10 "$APP_URL/api/health" | grep -q '"ok"'
          for path in / /api/health; do
            headers="$(curl -fsSI "$APP_URL$path" | tr 'A-Z' 'a-z')"
            for h in strict-transport-security content-security-policy x-frame-options \
                     x-content-type-options referrer-policy permissions-policy; do
              grep -q "^$h:" <<<"$headers" || { echo "$path is missing $h"; exit 1; }
            done
          done
